<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect width="1200" height="660" fill="#141416"/>

  <!-- ── Timeline card ─────────────────────────────────────────────── -->
  <rect x="40" y="48" width="700" height="380" rx="14" fill="#1C1C1F" stroke="#2C2C31"/>

  <text x="72" y="88" fill="#F2F2F7" font-size="18" font-weight="600">Timeline</text>
  <text x="72" y="110" fill="#8E8E93" font-size="12.5">one track per animated property; a keyframe is a diamond</text>

  <!-- ruler -->
  <line x1="72" y1="140" x2="708" y2="140" stroke="#2C2C31"/>
  <g fill="#5A5A60" font-size="10.5" text-anchor="middle">
    <text x="200" y="132">0.0s</text>
    <text x="340" y="132">0.5s</text>
    <text x="480" y="132">1.0s</text>
    <text x="620" y="132">1.5s</text>
  </g>
  <g stroke="#232327">
    <line x1="200" y1="140" x2="200" y2="396"/>
    <line x1="340" y1="140" x2="340" y2="396"/>
    <line x1="480" y1="140" x2="480" y2="396"/>
    <line x1="620" y1="140" x2="620" y2="396"/>
  </g>

  <!-- track: Opacity -->
  <text x="72" y="184" fill="#C7C7CC" font-size="12.5">Opacity</text>
  <line x1="170" y1="180" x2="690" y2="180" stroke="#2C2C31"/>
  <g fill="#1C1C1F" stroke="#0A84FF" stroke-width="1.6">
    <rect x="205" y="175" width="10" height="10" transform="rotate(45 210 180)"/>
    <rect x="395" y="175" width="10" height="10" transform="rotate(45 400 180)"/>
    <rect x="605" y="175" width="10" height="10" transform="rotate(45 610 180)"/>
  </g>
  <g stroke="#0A84FF" stroke-width="1.6">
    <line x1="215" y1="180" x2="390" y2="180"/>
    <line x1="410" y1="180" x2="600" y2="180"/>
  </g>

  <!-- track: Position (highlighted segment) -->
  <text x="72" y="250" fill="#F2F2F7" font-size="12.5" font-weight="600">Position</text>
  <line x1="170" y1="246" x2="690" y2="246" stroke="#2C2C31"/>
  <g fill="#1C1C1F" stroke="#0A84FF" stroke-width="1.6">
    <rect x="205" y="241" width="10" height="10" transform="rotate(45 210 246)"/>
    <rect x="335" y="241" width="10" height="10" transform="rotate(45 340 246)"/>
    <rect x="515" y="241" width="10" height="10" transform="rotate(45 520 246)"/>
  </g>
  <line x1="215" y1="246" x2="330" y2="246" stroke="#0A84FF" stroke-width="1.6"/>
  <line x1="530" y1="246" x2="690" y2="246" stroke="#3A3A40" stroke-width="1.6"/>
  <!-- the segment between the 2nd and 3rd keyframe: pressed -->
  <line x1="350" y1="246" x2="510" y2="246" stroke="#0A84FF" stroke-width="2.6"/>
  <circle cx="430" cy="246" r="13" fill="#0A84FF" opacity="0.16"/>
  <circle cx="430" cy="246" r="5.5" fill="#0A84FF"/>

  <!-- track: Scale -->
  <text x="72" y="316" fill="#C7C7CC" font-size="12.5">Scale</text>
  <line x1="170" y1="312" x2="690" y2="312" stroke="#2C2C31"/>
  <g fill="#1C1C1F" stroke="#0A84FF" stroke-width="1.6">
    <rect x="205" y="307" width="10" height="10" transform="rotate(45 210 312)"/>
    <rect x="455" y="307" width="10" height="10" transform="rotate(45 460 312)"/>
  </g>
  <line x1="215" y1="312" x2="450" y2="312" stroke="#0A84FF" stroke-width="1.6"/>

  <!-- callout: click the line -->
  <path d="M430 262 L430 340" stroke="#0A84FF" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M424 334 L430 344 L436 334" fill="none" stroke="#0A84FF" stroke-width="1.4"/>
  <text x="430" y="366" fill="#0A84FF" font-size="12.5" text-anchor="middle">press the line between two keyframes</text>
  <text x="430" y="384" fill="#8E8E93" font-size="11.5" text-anchor="middle">it opens that clip's settings</text>

  <!-- ── Clip card ─────────────────────────────────────────────────── -->
  <rect x="772" y="48" width="388" height="380" rx="14" fill="#1C1C1F" stroke="#2C2C31"/>
  <text x="800" y="88" fill="#F2F2F7" font-size="15" font-weight="600">Clip · Position</text>
  <text x="800" y="108" fill="#8E8E93" font-size="11.5">one field per row, label above its control</text>

  <g font-size="10.5" fill="#8E8E93">
    <text x="800" y="140">Animation</text>
    <text x="800" y="190">Type</text>
    <text x="800" y="240">Distance</text>
    <text x="800" y="290">Direction</text>
    <text x="800" y="340">Easing</text>
  </g>
  <g fill="#232327" stroke="#33333A">
    <rect x="800" y="148" width="332" height="30" rx="6"/>
    <rect x="800" y="198" width="332" height="30" rx="6"/>
    <rect x="800" y="248" width="332" height="30" rx="6"/>
    <rect x="800" y="298" width="332" height="30" rx="6"/>
    <rect x="800" y="348" width="332" height="30" rx="6"/>
  </g>
  <g fill="#E5E5EA" font-size="12">
    <text x="812" y="168">Position</text>
    <text x="812" y="218">Slide in</text>
    <text x="812" y="268">120 px</text>
    <text x="812" y="318">Left</text>
    <text x="812" y="368">Ease out · cubic</text>
  </g>
  <g stroke="#6E6E76" stroke-width="1.4" fill="none">
    <path d="M1112 160 l5 5 l5 -5"/>
    <path d="M1112 210 l5 5 l5 -5"/>
    <path d="M1112 310 l5 5 l5 -5"/>
    <path d="M1112 360 l5 5 l5 -5"/>
  </g>

  <!-- footer note -->
  <text x="40" y="470" fill="#6E6E76" font-size="12">The same card opens from the clip's handles; the segment is its span, so either end works.</text>
</svg>
